<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWall - Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* La idea es que esta pantalla sea como la bienvenida a la wallet */
        @keyframes scale-fade-in {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        
        @keyframes slide-up-fade {
            0% {
                opacity: 0;
                transform: translateY(15px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-logo {
            animation: scale-fade-in 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .animate-text {
            opacity: 0;
            animation: slide-up-fade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
        }

        .animate-subtitle {
            opacity: 0;
            animation: slide-up-fade 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.9s forwards;
        }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">
    <main class="w-full max-w-[380px] bg-gradient-to-b from-[#f0f6ff] to-white rounded-[32px] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col h-[820px] my-8 overflow-hidden relative items-center justify-center">
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-[300px] h-[300px] bg-blue-400/10 rounded-full blur-[60px]"></div>
        </div>
        <div class="relative flex flex-col items-center z-10">
            <img src="assets/logo.png" alt="AlkyWall Logo" class="w-36 h-36 object-contain drop-shadow-2xl animate-logo">
            <h1 class="text-4xl font-extrabold font-['Plus_Jakarta_Sans',sans-serif] mt-8 animate-text text-slate-900 tracking-tight">
                Alky<span class="text-blue-600">Wall</span>
            </h1>
            <p class="text-[10px] font-bold text-blue-600/75 uppercase tracking-[0.25em] mt-3 animate-subtitle">
                Banca Digital Segura
            </p>
        </div>

    </main>

    <!-- Lógica de Redirección Inteligente: Detecta si esta loggeado o no -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tiempoSplash = 2800;
            setTimeout(() => {
                // NOTA: Reemplazar este 'false' por la validación real
                // Ejemplo: const estaLogueado = localStorage.getItem('userToken') !== null;
                const estaLogueado = false; 
                if (estaLogueado) {
                    window.location.href = "dashboard/indexDashboard.html";
                } else {
                    window.location.href = "login/indexLogin.html";
                }
            }, tiempoSplash);
        });
    </script>
</body>
</html>
