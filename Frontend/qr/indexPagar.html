<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlkyWall - Pagar con QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Animación general de entrada de pantalla */
        .fade-in {
            animation: fadeInScreen 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInScreen {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Línea láser del escáner */
        .laser-line {
            width: 100%;
            height: 2px;
            background: #3b82f6; /* bg-blue-500 */
            box-shadow: 0 0 10px #3b82f6, 0 0 20px #3b82f6;
            position: absolute;
            top: 0;
            left: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Esquinas del visor QR */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: white;
            border-style: solid;
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 16px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 16px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 16px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 16px; }

        .scan-success {
            animation: successPulse 0.5s ease-out forwards;
        }

        @keyframes successPulse {
            0% { transform: scale(1); border-color: white; }
            50% { transform: scale(1.05); border-color: #22c55e; } /* green-500 */
            100% { transform: scale(1); border-color: #22c55e; }
        }

    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center h-[100dvh] overflow-hidden md:h-screen md:overflow-auto opacity-0 transition-opacity duration-100 ease-in-out">
    
    <main class="w-full md:max-w-[380px] bg-slate-900 flex flex-col h-[100dvh] md:h-[820px] md:my-8 relative overflow-hidden md:rounded-[32px] md:shadow-2xl">
        <div class="fade-in w-full h-full flex flex-col relative">
            
            <!-- Cabecera -->
            <header class="relative flex justify-between items-center p-6 shrink-0 z-10 text-white">
                <button id="btnVolver" class="w-10 h-10 rounded-xl bg-slate-800/80 backdrop-blur-md flex items-center justify-center hover:bg-slate-700 transition" onclick="history.back()">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span class="text-base font-extrabold">Escanear QR</span>
                <div class="w-10 h-10 rounded-xl bg-slate-800/80 backdrop-blur-md flex items-center justify-center">
                    <i class="fa-regular fa-lightbulb text-slate-300"></i>
                </div>
            </header>

            <!-- Área de escaneo simulada -->
            <div class="flex-1 flex flex-col items-center justify-center relative px-8">
                <!-- Visor -->
                <div id="visorScanner" class="w-64 h-64 relative mb-10">
                    <div class="corner corner-tl"></div>
                    <div class="corner corner-tr"></div>
                    <div class="corner corner-bl"></div>
                    <div class="corner corner-br"></div>
                    
                    <!-- Láser animado -->
                    <div id="laser" class="laser-line"></div>

                    <!-- Mensaje Éxito -->
                    <div id="msgExito" class="absolute inset-0 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
                        <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-white text-3xl mb-2 shadow-[0_0_20px_rgba(34,197,94,0.6)]">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                </div>

                <p class="text-white text-center font-semibold text-sm">Apunta la cámara a un código QR</p>
                <p class="text-slate-400 text-center font-medium text-xs mt-2">Buscando automáticamente...</p>
            </div>
            
            <!-- Botón Inferior -->
            <div class="p-6 mt-auto">
                <button class="w-full h-14 bg-slate-800 text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-2">
                    <i class="fa-regular fa-image"></i> Cargar desde galería
                </button>
            </div>

        </div>
    </main>

    <script src="../fx.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const visor = document.getElementById('visorScanner');
            const laser = document.getElementById('laser');
            const msgExito = document.getElementById('msgExito');
            
            // Simulación de escaneo exitoso a los 3 segundos
            setTimeout(() => {
                // Detener láser
                laser.style.display = 'none';
                
                // Efecto verde
                visor.classList.add('scan-success');
                msgExito.classList.remove('hidden');
                setTimeout(() => msgExito.classList.remove('opacity-0'), 50);

                // Redirigir a la pantalla de transferencia precargando los datos
                setTimeout(() => {
                    document.body.classList.add('opacity-0');
                    setTimeout(() => {
                        // Pasamos a transferencia (Paso 2 automáticamente por los params)
                        window.location.href = '../transferencia/indexTransferencia.html?alias=super.dia&nombre=Supermercado%20Día';
                    }, 100);
                }, 1000);

            }, 3000);
        });
    </script>
</body>
</html>
