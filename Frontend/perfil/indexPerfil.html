<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkyWall - Mi Perfil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Ocultar scrollbar visualmente pero permitir scroll */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen opacity-0 transition-opacity duration-100 ease-in-out">
    <main class="w-full max-w-[380px] bg-gradient-to-b from-[#f0f6ff] to-white rounded-[32px] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex flex-col h-[820px] my-8 relative overflow-y-auto scrollbar-hide">
        <!-- Cabecera -->
        <header class="relative flex justify-between items-center pt-2 pb-6">
            <button id="open-menu-btn" class="w-10 h-10 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-600 hover:bg-slate-50 transition">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-slate-900 text-lg font-extrabold font-['Plus_Jakarta_Sans',sans-serif]">Mi <span class="text-blue-600">Perfil</span></span>
            </div>
            <a href="../notificaciones/indexNotificaciones.html" class="w-10 h-10 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-50 transition cursor-pointer page-transition relative" title="Notificaciones">
                <i class="fa-regular fa-bell"></i>
                <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white box-content"></span>
            </a>
        </header>

        <!-- avatar -->
        <div class="flex flex-col items-center mt-2 mb-8">
            <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-600 to-blue-400 p-1 shadow-lg mb-4">
                <div class="w-full h-full rounded-full bg-white flex items-center justify-center border-4 border-white">
                    <span id="inicialesUsuario" class="text-3xl font-extrabold text-blue-600">FC</span>
                </div>
            </div>
            <h2 id="nombreUsuario" class="text-2xl font-bold text-slate-900 tracking-tight">Franco C.</h2>
            <p id="emailUsuario" class="text-sm font-medium text-slate-500 mt-1">franco@ejemplo.com</p>
            <div class="mt-3 bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border border-blue-100 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i> Cuenta Verificada
            </div>
        </div>

        <!-- Datos Bancarios-->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Datos de la cuenta</h3>
            <div class="bg-white rounded-[20px] border border-slate-200 shadow-sm overflow-hidden">
                
                <!-- CVU -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-center hover:bg-slate-50 transition cursor-pointer group">
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">CVU</span>
                        <span id="cvuUsuario" class="text-sm font-semibold text-slate-700 font-mono tracking-tight">0000003100000000000000</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-blue-600 group-hover:bg-blue-50 transition" title="Copiar CVU">
                        <i class="fa-regular fa-copy"></i>
                    </div>
                </div>

                <!-- Alias -->
                <div class="p-4 flex justify-between items-center hover:bg-slate-50 transition cursor-pointer group">
                    <div class="flex flex-col gap-1">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">Alias</span>
                        <span id="aliasUsuario" class="text-sm font-semibold text-slate-700 font-mono">franco.alkywall</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-blue-600 group-hover:bg-blue-50 transition" title="Copiar Alias">
                        <i class="fa-regular fa-copy"></i>
                    </div>
                </div>

            </div>
        </div>

        <!-- Datos Personales -->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">Información Personal</h3>
            <div class="bg-white rounded-[20px] border border-slate-200 shadow-sm overflow-hidden">
                
                <!-- DNI -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-500">
                            <i class="fa-regular fa-id-card text-sm"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-600">DNI</span>
                    </div>
                    <span id="dniUsuario" class="text-sm font-semibold text-slate-900">35.xxx.xxx</span>
                </div>

                <!-- Teléfono -->
                <div class="p-4 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-500">
                            <i class="fa-solid fa-mobile-screen-button text-sm"></i>
                        </div>
                        <span class="text-sm font-medium text-slate-600">Teléfono</span>
                    </div>
                    <span id="telefonoUsuario" class="text-sm font-semibold text-slate-900">+54 2920 xxx-xxx</span>
                </div>

            </div>
        </div>

    </main>

    <script src="../fx.js"></script>
    <script src="../menu/menu.js"></script>
    <script src="../menu/bottomNav.js"></script>
    <script src="srcPerfil.js"></script>

</body>
</html>
